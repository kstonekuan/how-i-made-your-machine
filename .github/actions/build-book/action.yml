name: Build book
description: Build the language tabs preprocessor and the mdBook site into ./book

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2

    - name: Install mdBook
      uses: taiki-e/install-action@v2
      with:
        tool: mdbook@0.5

    - name: Build language tabs preprocessor
      shell: bash
      run: cargo build --bin mdbook-language-tabs-preprocessor

    - name: Build mdBook site
      shell: bash
      run: mdbook build
